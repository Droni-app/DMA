<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2338"/>
      <stop offset="100%" stop-color="#080a18"/>
    </linearGradient>
    <linearGradient id="fav-ele" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#a175fd"/>
      <stop offset="50%" stop-color="#8a4cf7"/>
      <stop offset="100%" stop-color="#4e1ca9"/>
    </linearGradient>
    <linearGradient id="fav-ear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f23282"/>
      <stop offset="50%" stop-color="#8a4cf7"/>
      <stop offset="100%" stop-color="#31106e"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Droni border -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#7130eb" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Iconographic Elephant Mark optimized for tiny resolutions -->
  <g transform="translate(4, 3) scale(0.56)">
    <!-- Body -->
    <path d="M 38,72 C 34,68 33,58 35,48 C 37,38 45,30 55,28 C 65,26 73,30 78,38 C 76,48 71,58 64,65 C 56,73 45,75 38,72 Z" fill="url(#fav-ele)"/>
    <!-- Trunk -->
    <path d="M 73,34 C 80,40 84,50 82,60 C 80,68 82,75 88,74 C 93,73 95,66 93,57 C 92,52 93,48 95,47 C 97,46 99,50 98,56 C 96,69 88,80 79,78 C 72,76 72,67 74,58 C 76,49 76,42 70,36 C 67,33 63,31 58,30 C 63,28 68,29 73,34 Z" fill="url(#fav-ele)"/>
    <!-- Tusk -->
    <path d="M 64,56 C 70,58 78,60 83,54 C 80,60 74,64 66,63 C 63,62 62,59 64,56 Z" fill="#22cdee"/>
    <!-- Ear -->
    <path d="M 45,26 C 32,24 20,34 17,47 C 14,62 23,76 38,80 C 47,82 53,76 54,66 C 55,54 53,42 49,34 C 48,30 46,27 45,26 Z" fill="url(#fav-ear)"/>
    <!-- Eye -->
    <circle cx="61" cy="37" r="3.2" fill="#ffffff"/>
    <circle cx="61.8" cy="36.6" r="1.5" fill="#080a18"/>
    <!-- Spark -->
    <path d="M 97,36 L 98.2,39.5 L 101.7,40.7 L 98.2,42 L 97,45.5 L 95.8,42 L 92.3,40.7 L 95.8,39.5 Z" fill="#67e2f9"/>
  </g>
</svg>
